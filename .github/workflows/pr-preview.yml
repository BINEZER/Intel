# Every pull request gets its own live URL, posted as a comment.
#
# This is what makes review real: a reviewer can open the dual-calendar picker
# or the priority board and use it, instead of reading a diff and imagining it.
# Preview channels expire on their own, so nothing accumulates.
name: PR preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  preview:
    # A fork cannot read secrets, so the deploy would fail confusingly. Skip it
    # and let CI speak for the change instead.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # No env block: the public Firebase config lives in .env.production,
        # which Vite reads automatically.
        run: npx vite build

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: intel-afc60
          expires: 14d
