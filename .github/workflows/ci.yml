name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (calendar + tax arithmetic)
        run: npm test

      - name: Production build
        env:
          # Placeholders: Vite inlines these at build time, and the app only
          # validates them at runtime. Real values come from the environment.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
        run: npx vite build

      - name: Validate index definitions
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"

      - name: Security rules tests
        run: |
          npm i -g firebase-tools@13
          npm run test:rules
