name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (calendar + tax arithmetic)
        run: npm test

      - name: Validate Firestore rules and indexes parse
        run: |
          npm i -g firebase-tools@13
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
          firebase emulators:exec --only firestore --project demo-ci "echo 'rules compiled'"
