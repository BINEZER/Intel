# Deploys Firestore rules and indexes. Dev on every merge to main; prod only
# when a human runs it manually, so a bad rule can never reach live data
# without an explicit decision.
name: Deploy Firestore config

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firestore.indexes.json']
  workflow_dispatch:
    inputs:
      target:
        description: Which project to deploy to
        required: true
        default: dev
        type: choice
        options: [dev, prod]

# Rules and indexes are global to a project: two overlapping deploys can land in
# either order, so the last to finish wins rather than the last merged.
concurrency:
  group: firestore-${{ inputs.target || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: npm i -g firebase-tools@13

      - name: Deploy rules and indexes
        env:
          # A service-account JSON with the "Firebase Rules Admin" and
          # "Cloud Datastore Index Admin" roles. Stored per-environment so the
          # prod credential is unreachable from a dev deploy.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > sa.json
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project intel-afc60 \
            --non-interactive
          rm -f sa.json
