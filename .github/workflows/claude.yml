# Lets Claude Code branch, commit, push and open PRs on this repo without
# re-authenticating each time. Trigger by mentioning @claude in an issue or PR
# comment, or by running the workflow manually.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  workflow_dispatch:

jobs:
  claude:
    # Only react to an explicit @claude mention, never to every comment.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push branches
      pull-requests: write   # open and update PRs
      issues: write          # reply on issues
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
